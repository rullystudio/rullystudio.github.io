<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rully Studio</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Container Layout -->
    <div id="layout-navbar"></div>

    <main id="main-content" class="flex-grow-1">
        <!-- Konten halaman akan masuk ke sini -->
    </main>

    <div id="layout-footer"></div>

    <!-- 1. jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- 2. Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Script Pemuat Komponen dengan jQuery -->
    <script>
        // Fungsi untuk mengganti halaman konten
        function loadPage(pageName) {
            $('#main-content').load(`./pages/${pageName}.html`);
        }

        $(document).ready(function() {
            // Memuat komponen template dasar
            $('#layout-navbar').load('./template/navbar.html');
            $('#layout-footer').load('./template/footer.html');

            // Memuat halaman default (beranda)
            loadPage('beranda');
        });
    </script>
</body>
</html>
